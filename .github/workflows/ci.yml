name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Install project
        run: uv pip install --system -e '.[dev,providers,dashboard]'
      - name: Lint
        run: ruff check .
      - name: Test (offline suite)
        run: python -m pytest -q
      - name: Regression gate (end-to-end through the CLI)
        run: |
          replaygate record booking_happy ./_fx_happy
          replaygate regress ./_fx_happy
          replaygate record booking_books_without_confirm_regression ./_fx_bad
          replaygate regress ./_fx_bad && rc=0 || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "expected the regressed fixture to FAIL the gate with exit 1 (invariant violation), got exit $rc"
            exit 1
          fi
          replaygate record whatsapp_support ./_fx_wa --channel whatsapp
          replaygate replay ./_fx_wa
          replaygate regress ./_fx_wa
          replaygate regress ./fixtures/whatsapp_support
          replaygate record whatsapp_support_late_reply_regression ./_fx_wa_late --channel whatsapp
          replaygate regress ./_fx_wa_late && wa_rc=0 || wa_rc=$?
          if [ "$wa_rc" -ne 1 ]; then
            echo "expected the late-reply fixture to FAIL the gate with exit 1 (session-window invariant), got exit $wa_rc"
            exit 1
          fi
